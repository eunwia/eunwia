name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: eunwia
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=f48fb1&color_dots=#ffeef5,#fcd5de,#f48fb1,#c2185b,#880e4f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=f48fb1&color_dots=#ffeef5,#fcd5de,#f48fb1,#c2185b,#880e4f
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
